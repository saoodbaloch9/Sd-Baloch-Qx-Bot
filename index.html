<script>
// Check if already unlocked on this browser
if (localStorage.getItem("sd_bot_authorized") === "true") {
  document.getElementById("goldAuthModal").style.display = "none";
}

function checkSDKey() {
  const userKey = document.getElementById("sdPvtKey").value.trim();
  
  // Aap yahan apni valid keys ki list rakh sakte hain
  const validKeys = ["SD-9999", "SD-8888", "SDBALOCH2026", "SD-BALOCH-01"];
  
  if (validKeys.includes(userKey)) {
    // Unique key locking check logic
    let deviceID = navigator.userAgent;
    let savedLock = localStorage.getItem("KEY_LOCK_" + userKey);
    
    if (!savedLock) {
      localStorage.setItem("KEY_LOCK_" + userKey, deviceID);
      localStorage.setItem("sd_bot_authorized", "true");
      document.getElementById("goldAuthModal").style.display = "none";
      alert("✅ Access Granted! Welcome to SD BALOCH QX BOT.");
    } else if (savedLock === deviceID) {
      localStorage.setItem("sd_bot_authorized", "true");
      document.getElementById("goldAuthModal").style.display = "none";
    } else {
      alert("❌ Yeh Key kisi aur device par activate ho chuki hai! Nayi key lene ke liye WhatsApp par rabta karein.");
    }
  } else {
    alert("❌ Invalid Private Key! Re-check karein ya WhatsApp se Nayi Key lein.");
  }
}
</script>
