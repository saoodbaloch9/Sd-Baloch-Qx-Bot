   <script>
// Check if already unlocked on this browser
if (localStorage.getItem("sd_bot_authorized") === "true") {
  document.getElementById("goldAuthModal").style.display = "none";
}

function checkSDKey() {
  const userKey = document.getElementById("sdPvtKey").value.trim();
  
  // Aap ki valid keys ki list
  const validKeys = ["SD-9999", "SD-8888", "SDBALOCH2026", "SD-BALOCH-01"];
  
  if (validKeys.includes(userKey)) {
    
    // Har device ke liye ek unique permanent ID generate karna
    let deviceUUID = localStorage.getItem("SD_DEVICE_UUID");
    if (!deviceUUID) {
      deviceUUID = 'dev_' + Math.random().toString(36.25) + Date.now();
      localStorage.setItem("SD_DEVICE_UUID", deviceUUID);
    }

    // Check karein ke kya yeh key pehle se kisi aur database/storage mein locked hai?
    // Hum localStorage ke sath-sath Global Key Registry check karenge
    let globalKeyOwner = localStorage.getItem("OWNER_OF_" + userKey);
    let currentBrowserAuth = localStorage.getItem("SD_KEY_USED_ON_THIS_DEVICE");

    if (!globalKeyOwner) {
      // Pehli baar yeh key use ho rahi hai - isko is device ke sath lock kar do
      localStorage.setItem("OWNER_OF_" + userKey, deviceUUID);
      localStorage.setItem("SD_KEY_USED_ON_THIS_DEVICE", userKey);
      localStorage.setItem("sd_bot_authorized", "true");
      
      document.getElementById("goldAuthModal").style.display = "none";
      alert("✅ Access Granted! Yeh key ab aap ke is device ke sath permanently lock ho gai hai.");
      
    } else if (globalKeyOwner === deviceUUID) {
      // Agar yehi device pehle bhi yeh key use kar raha tha
      localStorage.setItem("sd_bot_authorized", "true");
      document.getElementById("goldAuthModal").style.display = "none";
      
    } else {
      // ❌ Error: Yeh key kisi aur ki device par pehle se registered hai!
      alert("❌ Error: Yeh Private Key pehle hi kisi aur device par activate ho chuki hai! Aap doosri device par yeh key use nahi kar sakte. Nayi key ke liye WhatsApp par rabta karein.");
    }

  } else {
    alert("❌ Invalid Private Key! Re-check karein ya WhatsApp se Nayi Key lein.");
  }
}
</script>
