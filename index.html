<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
// Page load par check karein ke kya yeh mobile pehle se unlocked hai
window.addEventListener('DOMContentLoaded', () => {
    let isUnlocked = localStorage.getItem("sd_bot_unlocked_device");
    if (isUnlocked === "true") {
        document.getElementById("goldAuthModal").style.display = "none";
    }
});

function checkSDKey() {
    const userKey = document.getElementById("sdPvtKey").value.trim();
    
    // Aap ki valid keys ki list
    const validKeys = ["SD-9999", "SD-8888", "SDBALOCH2026", "SD-BALOCH-01"];
    
    if (!userKey) {
        alert("⚠️ Meharbani karke apni Private Key enter karein!");
        return;
    }

    if (validKeys.includes(userKey)) {
        
        // Check karein ke kya yeh key pehle se use ho kar expire ho chuki hai?
        let usedKeysList = JSON.parse(localStorage.getItem("SD_GLOBAL_EXPIRED_KEYS") || "[]");
        
        if (usedKeysList.includes(userKey)) {
            alert("❌ Error: Yeh Private Key pehle hi use ho kar expire ho chuki hai! Doosre mobile par nahi chal sakti.");
            return;
        }

        // Key ko use mein la kar foran expired/locked list mein daal dein
        usedKeysList.push(userKey);
        localStorage.setItem("SD_GLOBAL_EXPIRED_KEYS", JSON.stringify(usedKeysList));
        
        // Is mobile ko authorized kar do
        localStorage.setItem("sd_bot_unlocked_device", "true");
        document.getElementById("goldAuthModal").style.display = "none";
        
        alert("✅ Success! Key successfully activate ho gai hai aur ab yeh expire ho chuki hai.");
        
    } else {
        alert("❌ Invalid Key! Sahi key enter karein ya WhatsApp par rabta karke nayi key lein.");
    }
}
</script>
