    <!-- 3. STRICT LOCKING & AUTHENTICATION SCRIPT -->
    <script>
    // System Initialization
    (function initAuthSystem() {
        // Generate Unique Device ID if not exists
        let currentDeviceId = localStorage.getItem("SD_MY_DEVICE_ID");
        if (!currentDeviceId) {
            currentDeviceId = "DEV-" + Math.random().toString(36).substring(2, 10) + "-" + Date.now();
            localStorage.setItem("SD_MY_DEVICE_ID", currentDeviceId);
        }

        // Check Access Status on Page Load
        let activeKey = localStorage.getItem("SD_ACTIVE_KEY");
        let modal = document.getElementById("goldAuthModal");

        if (activeKey) {
            let keyBindInfo = localStorage.getItem("SD_BIND_" + activeKey);
            if (keyBindInfo === currentDeviceId) {
                // Device Authorized
                modal.style.display = "none";
            } else {
                // Key copied from elsewhere or invalid
                localStorage.removeItem("SD_ACTIVE_KEY");
                modal.style.display = "flex";
            }
        } else {
            modal.style.display = "flex";
        }
    })();

    function verifySDKey() {
        const inputKey = document.getElementById("sdPvtKey").value.trim();
        
        // Aapki VIP Private Keys ki list
        const adminKeys = ["SD-9999", "SD-8888", "SDBALOCH2026", "SD-BALOCH-01", "SD-KEY-101"];
        
        if (!inputKey) {
            alert("⚠️ Meharbani karke apni Private Key enter karein!");
            return;
        }

        if (!adminKeys.includes(inputKey)) {
            alert("❌ Invalid Private Key! Re-check karein ya WhatsApp par Admin se Nayi Key lein.");
            return;
        }

        let myDeviceId = localStorage.getItem("SD_MY_DEVICE_ID");
        let existingLock = localStorage.getItem("SD_BIND_" + inputKey);

        if (!existingLock) {
            // First time activation: Key is permanently locked to THIS device
            localStorage.setItem("SD_BIND_" + inputKey, myDeviceId);
            localStorage.setItem("SD_ACTIVE_KEY", inputKey);
            document.getElementById("goldAuthModal").style.display = "none";
            alert("✅ Access Granted! Key aapke device ke sath permanently bind ho gai hai.");
        } 
        else if (existingLock === myDeviceId) {
            // Same device unlocking again
            localStorage.setItem("SD_ACTIVE_KEY", inputKey);
            document.getElementById("goldAuthModal").style.display = "none";
        } 
        else {
            // Access Denied: Key bound to another device
            alert("❌ ACCESS DENIED! Yeh Key pehle hi kisi aur mobile par activate ho chuki hai. Aap doosre mobile par yeh key use nahi kar sakte.");
        }
    }
    </script>
