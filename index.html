        <h2 style="color:#d4af37; font-size:20px; letter-spacing:1px; margin-bottom:8px; text-transform:uppercase;">SD BALOCH QX BOT</h2>
        <p style="color:#aaa; font-size:13px; margin-bottom:20px;">Secure Private Key Activation Terminal</p>

        <!-- Input Box -->
        <input type="text" id="sdPvtKey" placeholder="Enter Your Private Key" style="width:100%; padding:12px; background:#111; border:1px solid #d4af37; border-radius:10px; color:#fff; text-align:center; font-size:15px; outline:none; box-sizing:border-box; margin-bottom:15px;">
        
        <!-- Submit Button -->
        <button onclick="verifySDKey()" style="width:100%; padding:12px; background:linear-gradient(135deg, #d4af37, #aa771c); border:none; border-radius:10px; color:#000; font-weight:bold; font-size:15px; cursor:pointer; text-transform:uppercase; box-shadow:0 0 10px rgba(212,175,55,0.5);">UNLOCK BOT</button>

        <!-- WhatsApp Help Section -->
        <div style="margin-top:25px; padding-top:15px; border-top:1px solid #222;">
          <p style="color:#fff; font-size:13px; margin-bottom:4px;">Need Activation Key?</p>
          <p style="color:#d4af37; font-size:13px; margin-bottom:12px;">پرائیویٹ کی حاصل کرنے کے لیے ہم سے رابطہ کریں</p>
          
          <a href="https://wa.me/923316813901?text=Hello%20SD%20Baloch,%20mujhe%20SD%20BALOCH%20QX%20BOT%20ki%20Private%20Key%20chahiye" target="_blank" style="display:inline-flex; align-items:center; justify-content:center; gap:8px; background:#25D366; color:#fff; text-decoration:none; padding:10px 18px; border-radius:25px; font-weight:bold; font-size:13px; box-shadow:0 0 12px rgba(37,211,102,0.4);">
            💬 Contact Admin on WhatsApp
          </a>
        </div>

      </div>
    </div>

    <!-- MAIN BOT CONTENT -->
    <div id="mainBotApp">
    </div>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
        let isAuth = localStorage.getItem("sd_bot_authorized");
        if (isAuth === "true") {
            document.getElementById("goldAuthModal").style.display = "none";
        }
    });

    function verifySDKey() {
        const inputKey = document.getElementById("sdPvtKey").value.trim();
        const validKeys = ["SD-9999", "SD-8888", "SDBALOCH2026", "SD-BALOCH-01"];

        if (!inputKey) {
            alert("⚠️ Meharbani karke apni Private Key enter karein!");
            return;
        }

        if (!validKeys.includes(inputKey)) {
            alert("❌ Invalid Key! Sahi key enter karein ya WhatsApp se Nayi Key lein.");
            return;
        }

        let keyStatus = localStorage.getItem("KEY_USED_" + inputKey);
        if (keyStatus === "true") {
            alert("❌ ACCESS DENIED: Yeh Private Key pehle hi use ho chuki hai!");
            return;
        }

        localStorage.setItem("KEY_USED_" + inputKey, "true");
        localStorage.setItem("sd_bot_authorized", "true");
        document.getElementById("goldAuthModal").style.display = "none";
        alert("✅ Success! Key successfully activate ho gayi hai.");
    }
    </script>
