        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Aap ka Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyDIfFYyXAopbRCF0c2Xhyo8ei_oI6_HowQ",

          projectId: "sd-baloch-qx-bot-keys",
          storageBucket: "sd-baloch-qx-bot-keys.firebasestorage.app",
          messagingSenderId: "778747168222",
          appId: "1:778747168222:web:9839204a4910d0019a094f",
          measurementId: "G-B6ZEFQK4G1"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Har mobile ke liye unique Device ID generate karna
        let deviceId = localStorage.getItem("SD_DEVICE_ID");
        if (!deviceId) {
            deviceId = "DEV-" + Math.random().toString(36).substring(2, 10) + "-" + Date.now();
            localStorage.setItem("SD_DEVICE_ID", deviceId);
        }

        // Page load hone par check karna ke kya yeh device pehle se authorized hai
        window.addEventListener('DOMContentLoaded', async () => {
            let savedKey = localStorage.getItem("SD_ACTIVE_KEY");
            if (savedKey) {
                try {
                    const docRef = doc(db, "bot_keys", savedKey);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists() && docSnap.data().deviceId === deviceId) {
                        document.getElementById("goldAuthModal").style.display = "none";
                    } else {
                        localStorage.removeItem("SD_ACTIVE_KEY");
                        document.getElementById("goldAuthModal").style.display = "flex";
                    }
                } catch (e) {
                    console.error(e);
                }
            }
        });

        // Global function for key verification
        window.verifySDKey = async function() {
            const inputKey = document.getElementById("sdPvtKey").value.trim();
const validKeys = ["SD-BALOCH-48921", "SD-BALOCH-72314", "SD-BALOCH-91045", "SD-BALOCH-62839", "SD-BALOCH-15482", "SD-BALOCH-38910", "SD-BALOCH-50284", "SD-BALOCH-81932", "SD-BALOCH-27419", "SD-BALOCH-69351", "SD-BALOCH-40187", "SD-BALOCH-58320", "SD-BALOCH-91426", "SD-BALOCH-32785", "SD-BALOCH-61093", "SD-BALOCH-78241", "SD-BALOCH-19054", "SD-BALOCH-45692", "SD-BALOCH-83104", "SD-BALOCH-26983", "SD-BALOCH-50419", "SD-BALOCH-71825", "SD-BALOCH-39460", "SD-BALOCH-62187", "SD-BALOCH-95031", "SD-BALOCH-18342", "SD-BALOCH-47960", "SD-BALOCH-80251", "SD-BALOCH-23694", "SD-BALOCH-61583", "SD-BALOCH-49120", "SD-BALOCH-73059", "SD-BALOCH-10894", "SD-BALOCH-56213", "SD-BALOCH-89420", "SD-BALOCH-31567", "SD-BALOCH-67842", "SD-BALOCH-92105", "SD-BALOCH-24891", "SD-BALOCH-53908", "SD-BALOCH-70412", "SD-BALOCH-18693", "SD-BALOCH-42510", "SD-BALOCH-86934", "SD-BALOCH-31095", "SD-BALOCH-65421", "SD-BALOCH-98302", "SD-BALOCH-21789", "SD-BALOCH-54631", "SD-BALOCH-79240", "SD-9999", "SD-8888", "SDBALOCH2026", "SD-BALOCH-01"];


            if (!inputKey) {
                alert("⚠️ Meharbani karke apni Private Key enter karein!");
                return;
            }

            if (!validKeys.includes(inputKey)) {
                alert("❌ Invalid Key! Sahi key enter karein ya WhatsApp se Nayi Key lein.");
                return;
            }

            try {
                const docRef = doc(db, "bot_keys", inputKey);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    let keyData = docSnap.data();
                    if (keyData.deviceId === deviceId) {
                        // Agar wahi purana mobile hai toh access de do
                        localStorage.setItem("SD_ACTIVE_KEY", inputKey);
                        document.getElementById("goldAuthModal").style.display = "none";
                    } else {
                        // Agar key kisi aur mobile par pehle use ho chuki hai
                        alert("❌ ACCESS DENIED: Yeh Private Key pehle hi kisi aur mobile par activate ho chuki hai aur doosre mobile par nahi chal sakti!");
                    }
                } else {
                    // Pehli baar key lag rahi hai, isko online database mein is device ke sath lock kar do!
                    await setDoc(docRef, {
                        key: inputKey,
                        deviceId: deviceId,
                        activatedAt: new Date().toISOString()
                    });

                    localStorage.setItem("SD_ACTIVE_KEY", inputKey);
                    document.getElementById("goldAuthModal").style.display = "none";
                    alert("✅ Success! Key successfully aapke device ke sath online lock ho gayi hai.");
                }
            } catch (error) {
                alert("⚠️ Connection Error: Internet check karein aur dobara koshish karein.");
                console.error(error);
            }
        }
